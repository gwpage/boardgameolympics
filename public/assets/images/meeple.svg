<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Meeple "like" icon (SPEC § Message Board; COLORS.md meeple tokens).
    Original placeholder art until final art is delivered (CONTENT_CHECKLIST).

    Painted entirely with currentColor, so CSS sets its colour through the
    `color` property, using the meeple-inactive token normally and the
    meeple-active token when liked (see COLORS.md; no double hyphens allowed
    inside an XML comment, hence no literal var() examples here).
    To recolour it, the shape has to be in the page's DOM. Reference it with
      <svg class="meeple" viewBox="0 0 24 24"><use href="assets/images/meeple.svg#meeple"/></svg>
    (an <img> would always render it black). Same-origin only.

    Rounded stroke joins soften the straight-line body into the classic meeple shape.
  -->
  <title>Meeple</title>
  <g id="meeple" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    <circle cx="12" cy="5" r="3.5"/>
    <path d="M10 8 L14 8 L20.5 9.5 Q22 10.2 21.2 12 L15.5 13 L19.5 21 Q19.8 22 18.8 22 L14.5 22 L12 17.5 L9.5 22 L5.2 22 Q4.2 22 4.5 21 L8.5 13 L2.8 12 Q2 10.2 3.5 9.5 Z"/>
  </g>
</svg>
