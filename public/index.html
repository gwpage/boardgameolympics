<!doctype html>
<!--
  public/index.html: the only page. Same URL, two views (SPEC § Home Page):
  the public landing page when logged out, and the dashboard when logged in.
  js/app.js decides which to show.

  Every path in this file is RELATIVE (no leading "/"), so the site works at
  "/" in production and at "/public/" on a local server rooted at the repo
  (ADR-003). tests/js/test_001_harness.js enforces this.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board Game Olympics</title>

  <!--
    Theme bootstrap (COLORS.md § Preventing Flash of Wrong Theme; ISSUE-006).
    Stays inline and runs before the stylesheet, so the correct theme is set
    before the first paint. After that, js/theme.js takes over.

    It repeats the rule in resolveTheme() in js/theme.js, plus that file's
    storage key and media query: KEEP THEM IN SYNC.
    tests/js/test_006_theme.js runs this script against fakes and fails if it
    ever chooses differently from theme.js.

    Production's Content-Security-Policy (ISSUE-030) must allow this script
    by its hash. Any edit here, even whitespace, changes the hash.
  -->
  <script>
    (function () {
      var saved = null;
      try {
        saved = localStorage.getItem('theme');
      } catch (error) {
        // Storage can be blocked (private mode, strict settings). theme.js
        // reports this; here we just fall back to the system setting.
        saved = null;
      }
      var systemPrefersDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var theme = saved === 'dark' || saved === 'light' ? saved : (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/images/logo-small.png">

  <!--
    Load order matters. `defer` classic scripts and module scripts run in
    document order once the HTML is parsed:
      1. config.js:  defines the global CONFIG. Gitignored: copy config.example.js
                     locally; Cloudflare Pages generates it at deploy (ADR-003).
      2. Supabase:   defines the global `supabase`. Pinned to an exact version
                     with an SRI hash (ADR-006); see documentation/README.md to upgrade.
      3. js/app.js:  the app entry point (ES module, no build step, ADR-005).
  -->
  <script defer src="config.js"></script>
  <script defer
          src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!--
    Static header, outside #app, so it shows on every view and rendering a
    view never removes it. ISSUE-009 adds the logo, nav and logout here.
    The theme toggle ships hidden and empty. js/theme.js draws its icon and
    label and then reveals it, so without scripts there's no dead button.
  -->
  <header class="site-header">
    <button id="theme-toggle" class="theme-toggle" type="button" hidden></button>
  </header>

  <noscript>Board Game Olympics needs JavaScript enabled.</noscript>
  <!-- js/app.js renders the landing page or the dashboard into #app (ISSUE-009). -->
  <main id="app">Loading…</main>
</body>
</html>
