<!doctype html>
<!--
  public/index.html: the only page. Same URL, two views (SPEC § Home Page):
  the public landing page when logged out, and the dashboard when logged in.
  js/app.js decides which to show.

  Every path in this file is RELATIVE (no leading "/"), so the site works at
  "/" in production and at "/public/" on a local server rooted at the repo
  (ADR-003). tests/js/test_001_harness.js enforces this.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Must equal SITE_NAME in js/app.js, which sets the title as views change (a test checks). -->
  <title>Board Game Olympics</title>

  <!--
    Search results and link previews (ISSUE-010, ADR-024). Search engines and
    chat apps read these without running JavaScript, so they live here.
    - data-placeholder marks what's still a placeholder, so it can be found
      before launch: the description (CONTENT_CHECKLIST.md § Meta / SEO).
    - Open Graph needs absolute URLs, so og:url and og:image name the
      production site, https://boardgameolympics.net/. They're the only
      absolute URLs in the file; everything the page itself loads is relative
      (ADR-003), so local copies still work.
    - og-image.png is a 1200 × 630 placeholder (logo and name on the dark
      theme's background) until the Boss supplies one.
    - Twitter / X reads og:title, og:description and og:image when its own
      tags are missing, so only twitter:card is needed.
  -->
  <meta name="description" content="Join the annual Board Game Olympics: an invite-only gathering of board game enthusiasts competing for glory." data-placeholder>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Board Game Olympics">
  <meta property="og:title" content="Board Game Olympics">
  <meta property="og:description" content="Join the annual Board Game Olympics: an invite-only gathering of board game enthusiasts competing for glory." data-placeholder>
  <meta property="og:url" content="https://boardgameolympics.net/">
  <meta property="og:image" content="https://boardgameolympics.net/assets/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Board Game Olympics logo: rings made of meeples, dice and coins above a trophy and game pieces">
  <meta name="twitter:card" content="summary_large_image">

  <!--
    Theme bootstrap (COLORS.md § Preventing Flash of Wrong Theme; ISSUE-006).
    Stays inline and runs before the stylesheet, so the correct theme is set
    before the first paint. After that, js/theme.js takes over.

    It repeats the rule in resolveTheme() in js/theme.js, plus that file's
    storage key and media query: KEEP THEM IN SYNC.
    tests/js/test_006_theme.js runs this script against fakes and fails if it
    ever chooses differently from theme.js.

    Production's Content-Security-Policy (ISSUE-030) must allow this script
    by its hash. Any edit here, even whitespace, changes the hash.
  -->
  <script>
    (function () {
      var saved = null;
      try {
        saved = localStorage.getItem('theme');
      } catch (error) {
        // Storage can be blocked (private mode, strict settings). theme.js
        // reports this; here we just fall back to the system setting.
        saved = null;
      }
      var systemPrefersDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var theme = saved === 'dark' || saved === 'light' ? saved : (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/images/logo-small.png">

  <!--
    Load order matters. `defer` classic scripts and module scripts run in
    document order once the HTML is parsed:
      1. config.js:  defines the global CONFIG. Gitignored: copy config.example.js
                     locally; Cloudflare Pages generates it at deploy (ADR-003).
      2. Supabase:   defines the global `supabase`. Pinned to an exact version
                     with an SRI hash (ADR-006); see documentation/README.md to upgrade.
      3. js/app.js:  the app entry point (ES module, no build step, ADR-005).
  -->
  <script defer src="config.js"></script>
  <script defer
          src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!--
    Static header, outside #app, so it shows on every view and rendering a
    view never removes it (ADR-020, ADR-023).
    - The logo links home. It uses the small logo: logo.png is 2 MB.
    - The nav and Log out button ship hidden and empty. js/app.js fills in the
      nav for members, and shows Log out to anyone signed in, once it knows
      who the visitor is.
    - The theme toggle also ships hidden and empty. js/theme.js draws its icon
      and label and then reveals it, so without scripts there's no dead button.
  -->
  <header class="site-header">
    <a class="site-logo" href="#/">
      <img src="assets/images/logo-small.png" alt="" width="40" height="40">
      <span class="site-logo-text">Board Game Olympics</span>
    </a>
    <nav id="site-nav" class="site-nav" aria-label="Main" hidden></nav>
    <button id="theme-toggle" class="theme-toggle" type="button" hidden></button>
    <button id="logout-button" class="logout-button" type="button" hidden>Log out</button>
  </header>

  <noscript>Board Game Olympics needs JavaScript enabled.</noscript>
  <!--
    js/app.js renders the view into #app: the landing page, the dashboard and
    member pages, or a sign-in state (ISSUE-009). "Loading…" is the first
    paint, so a signed-in member never sees the landing page flash up.
  -->
  <main id="app">Loading…</main>
</body>
</html>
